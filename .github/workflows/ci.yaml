name: CI

# Gates every PR and every push to `dev`. Deliberately NOT `push: main` —
# release.yaml owns main, and doubling up burns minutes on the same commit.
on:
  pull_request:
  push:
    branches: [dev]

# A new push supersedes the run it interrupted.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # `build` is `tsc && vite build`, so this is the typecheck too.
      - name: Build
        run: pnpm build

  rust:
    name: Rust (fmt + clippy + test)
    # Windows deliberately: it is the primary target, and it avoids the
    # libwebkit2gtk-4.1-dev / libgtk-3-dev install the Tauri crate needs on
    # Linux. Nothing here is platform-specific beyond path handling, which is
    # exactly the thing worth testing on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        # Single-threaded: the tests write into the real %APPDATA%/aiSLAP/db/,
        # so parallel runs can collide on the shared index.
        run: cargo test -- --test-threads=1
