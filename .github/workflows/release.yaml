name: release

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check-changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if version was bumped
        id: check-changes
        run: |
          # Manual dispatch always forces a build.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Skip on first push to branch (null before SHA).
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OLD=$(git show ${{ github.event.before }}:package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version" 2>/dev/null || echo "0.0.0")
          NEW=$(node -p "require('./package.json').version")
          if [ "$OLD" != "$NEW" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          TAG="aiSLAP-v${VERSION}"
          BASE="https://github.com/vsps/aiSLAP/releases/download/${TAG}"

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges | head -80)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges | head -80)
          fi

          BODY=$(cat <<RELEASE_BODY
## What's changed

${CHANGELOG}

---

## Downloads

> **Windows SmartScreen warning:** the installer is self-signed. Click **More info -> Run anyway** to proceed.
> **macOS Gatekeeper:** right-click the .dmg and choose **Open**, or allow it in **System Settings -> Privacy & Security -> Open Anyway**.

### Windows
| | |
|---|---|
| MSI installer | [aiSLAP_${VERSION}_x64_en-US.msi](${BASE}/aiSLAP_${VERSION}_x64_en-US.msi) |
| EXE installer | [aiSLAP_${VERSION}_x64-setup.exe](${BASE}/aiSLAP_${VERSION}_x64-setup.exe) |

### macOS
| | |
|---|---|
| Apple Silicon (M-series) | [aiSLAP_${VERSION}_aarch64.dmg](${BASE}/aiSLAP_${VERSION}_aarch64.dmg) |
| Intel | [aiSLAP_${VERSION}_x64.dmg](${BASE}/aiSLAP_${VERSION}_x64.dmg) |

### Linux
| | |
|---|---|
| AppImage | [aiSLAP_${VERSION}_amd64.AppImage](${BASE}/aiSLAP_${VERSION}_amd64.AppImage) |
| .deb | [aiSLAP_${VERSION}_amd64.deb](${BASE}/aiSLAP_${VERSION}_amd64.deb) |
RELEASE_BODY
)

          {
            printf '%s\n' 'body<<RELEASE_EOF'
            printf '%s\n' "$BODY"
            printf '%s\n' 'RELEASE_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aiSLAP-v${{ steps.pkg.outputs.version }}
          name: "aiSLAP v${{ steps.pkg.outputs.version }}"
          body: |
            ${{ steps.notes.outputs.body }}
          draft: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [check-version, create-release]
    if: needs.check-version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Ubuntu dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build & upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}

  publish-release:
    needs: [check-version, create-release, build]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false
            })
