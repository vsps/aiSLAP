name: release

permissions:
  contents: write

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build even if version is unchanged"
        type: boolean
        default: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check-changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if version was bumped
        id: check-changes
        run: |
          # Manual dispatch with force_build=true skips the version check.
          if [ "${{ inputs.force_build }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Skip on first push to branch (null before SHA).
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OLD=$(git show ${{ github.event.before }}:package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).version" 2>/dev/null || echo "0.0.0")
          NEW=$(node -p "require('./package.json').version")
          if [ "$OLD" != "$NEW" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      version: ${{ steps.pkg.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          TAG="aiSLAP-v${VERSION}"
          BASE="https://github.com/vsps/aiSLAP/releases/download/${TAG}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s" --no-merges | head -80)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges | head -80)
          fi
          BODY_FILE=$(mktemp)
          printf "## What's changed\n\n%s\n\n---\n\n" "$CHANGELOG" >> "$BODY_FILE"
          printf "> **Windows SmartScreen warning:** the installer is self-signed. Click **More info -> Run anyway** to proceed.\n" >> "$BODY_FILE"
          printf "> **macOS:** the app is signed and notarized by Apple, so it should open normally. If you still hit a Gatekeeper prompt, right-click the .dmg and choose **Open**, or allow it in **System Settings -> Privacy & Security -> Open Anyway**.\n\n" >> "$BODY_FILE"
          printf "### Windows\n| | |\n|---|---|\n" >> "$BODY_FILE"
          printf "| MSI installer | [aiSLAP_%s_x64_en-US.msi](%s/aiSLAP_%s_x64_en-US.msi) |\n" "$VERSION" "$BASE" "$VERSION" >> "$BODY_FILE"
          printf "| EXE installer | [aiSLAP_%s_x64-setup.exe](%s/aiSLAP_%s_x64-setup.exe) |\n\n" "$VERSION" "$BASE" "$VERSION" >> "$BODY_FILE"
          printf "### macOS\n| | |\n|---|---|\n" >> "$BODY_FILE"
          printf "| Apple Silicon (M-series) | [aiSLAP_%s_aarch64.dmg](%s/aiSLAP_%s_aarch64.dmg) |\n" "$VERSION" "$BASE" "$VERSION" >> "$BODY_FILE"
          printf "| Intel | [aiSLAP_%s_x64.dmg](%s/aiSLAP_%s_x64.dmg) |\n\n" "$VERSION" "$BASE" "$VERSION" >> "$BODY_FILE"
          printf "### Linux\n| | |\n|---|---|\n" >> "$BODY_FILE"
          printf "| AppImage | [aiSLAP_%s_amd64.AppImage](%s/aiSLAP_%s_amd64.AppImage) |\n" "$VERSION" "$BASE" "$VERSION" >> "$BODY_FILE"
          printf "| .deb | [aiSLAP_%s_amd64.deb](%s/aiSLAP_%s_amd64.deb) |\n" "$VERSION" "$BASE" "$VERSION" >> "$BODY_FILE"
          {
            printf '%s\n' 'body<<RELEASE_EOF'
            cat "$BODY_FILE"
            printf '%s\n' 'RELEASE_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aiSLAP-v${{ steps.pkg.outputs.version }}
          name: "aiSLAP v${{ steps.pkg.outputs.version }}"
          body: |
            ${{ steps.notes.outputs.body }}
          draft: true
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

  verify-apple-cert:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: macos-latest
    steps:
      - name: Decode cert & verify signing identity
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -e
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::error::one or more of APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY secrets is empty"
            exit 1
          fi

          KEYCHAIN="verify.keychain"
          KEYCHAIN_PW=$(openssl rand -base64 24)
          trap 'security delete-keychain "$KEYCHAIN" 2>/dev/null; rm -f cert.p12' EXIT

          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"

          if ! security import cert.p12 -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign; then
            echo "::error::failed to import cert.p12 - check APPLE_CERTIFICATE (base64) and APPLE_CERTIFICATE_PASSWORD"
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null

          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -qF "$APPLE_SIGNING_IDENTITY"; then
            echo "::error::APPLE_SIGNING_IDENTITY '$APPLE_SIGNING_IDENTITY' not found in certificate. Identities present:"
            security find-identity -v -p codesigning "$KEYCHAIN"
            exit 1
          fi

          echo "Signing identity verified: $APPLE_SIGNING_IDENTITY"

  build:
    needs: [check-version, create-release, verify-apple-cert]
    if: needs.check-version.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Ubuntu dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build & upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}

  publish-release:
    needs: [check-version, create-release, build]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false
            })

  update-readme:
    needs: [check-version, create-release, publish-release]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Rewrite release links in README
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          TAG="aiSLAP-v${VERSION}"
          BASE="https://github.com/vsps/aiSLAP/releases/download/${TAG}"
          BLOCK=$(mktemp)
          printf "> **Windows SmartScreen warning:** the installer is self-signed. Click **More info -> Run anyway** to proceed.\n" >> "$BLOCK"
          printf "> **macOS:** the app is signed and notarized by Apple, so it should open normally. If you still hit a Gatekeeper prompt, right-click the .dmg and choose **Open**, or allow it in **System Settings -> Privacy & Security -> Open Anyway**.\n\n" >> "$BLOCK"
          printf "### Windows\n| | |\n|---|---|\n" >> "$BLOCK"
          printf "| MSI installer | [aiSLAP_%s_x64_en-US.msi](%s/aiSLAP_%s_x64_en-US.msi) |\n" "$VERSION" "$BASE" "$VERSION" >> "$BLOCK"
          printf "| EXE installer | [aiSLAP_%s_x64-setup.exe](%s/aiSLAP_%s_x64-setup.exe) |\n\n" "$VERSION" "$BASE" "$VERSION" >> "$BLOCK"
          printf "### macOS\n| | |\n|---|---|\n" >> "$BLOCK"
          printf "| Apple Silicon (M-series) | [aiSLAP_%s_aarch64.dmg](%s/aiSLAP_%s_aarch64.dmg) |\n" "$VERSION" "$BASE" "$VERSION" >> "$BLOCK"
          printf "| Intel | [aiSLAP_%s_x64.dmg](%s/aiSLAP_%s_x64.dmg) |\n\n" "$VERSION" "$BASE" "$VERSION" >> "$BLOCK"
          printf "### Linux\n| | |\n|---|---|\n" >> "$BLOCK"
          printf "| AppImage | [aiSLAP_%s_amd64.AppImage](%s/aiSLAP_%s_amd64.AppImage) |\n" "$VERSION" "$BASE" "$VERSION" >> "$BLOCK"
          printf "| .deb | [aiSLAP_%s_amd64.deb](%s/aiSLAP_%s_amd64.deb) |\n" "$VERSION" "$BASE" "$VERSION" >> "$BLOCK"
          awk -v f="$BLOCK" '
            /<!-- release-links:start -->/ {print; while ((getline l < f) > 0) print l; skip=1; next}
            /<!-- release-links:end -->/   {skip=0}
            !skip' README.md > README.tmp && mv README.tmp README.md

      - name: Commit & push
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: README links for v${VERSION} [skip ci]"
          git pull --rebase origin main
          git push origin main
